spring:
  application:
    name: mangomango-ledger
  datasource:
    url: jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

ledger:
  # Client IDs (X-Client-Id header) allowed to write to the model catalog.
  admin-clients: admin
  seed-catalog: true
  recommendation-lookback-days: 30

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
